spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
#                - RedirectTo=302, https://github.com/ajay-1dev?tab=repositories

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Custom-Header, Ajay


server:
  port: 9003

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka